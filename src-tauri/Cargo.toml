[package]
name = "teacher-platform"
version = "1.0.0"
description = "教师个人工作平台 —— 教学与班级管理一站式桌面应用"
authors = ["teacher"]
edition = "2021"

# 桌面应用入口（库形式，供 tauri 调用）
[lib]
name = "teacher_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
